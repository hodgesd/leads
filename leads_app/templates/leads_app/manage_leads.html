{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Leads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
</head>
<body class="bg-gray-100 text-gray-900">

    <!-- Navigation Bar -->
    <nav class="bg-gray-800 text-white p-4 flex justify-between items-center">
        <div class="flex items-center">
            <img src="{% static 'images/wide_logo.png' %}" alt="Quick Selling Solutions" class="h-12 mr-3">
            <span class="text-yellow-400 text-xl font-bold">STL House Buyers</span>
        </div>
        <ul class="flex space-x-6 text-sm font-semibold">
            <li><a href="#" class="hover:text-yellow-400">Dashboard</a></li>
            <li><a href="#" class="hover:text-yellow-400">Leads</a></li>
            <li><a href="#" class="hover:text-yellow-400">Settings</a></li>
            <li><a href="#" class="hover:text-yellow-400">Logout</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto p-6">
        <h1 class="text-2xl font-bold text-gray-700 mb-4">Manage Leads</h1>

        <!-- Leads Table -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Address</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200" id="leads-table">
                    {% for lead in leads %}
                    <tr>
                        <td class="px-6 py-4 text-sm text-gray-900">{{ lead.address }}</td>
                        <td class="px-6 py-4 text-sm text-gray-900">{{ lead.phone }}</td>
                        <td class="px-6 py-4 text-sm text-gray-900">{{ lead.email }}</td>
                        <td class="px-6 py-4 text-sm">
                            <select
                                name="status"
                                hx-put="{% url 'update_lead_status' lead.id %}"
                                hx-target="this"
                                hx-swap="outerHTML"
                                class="w-full px-3 py-2 border border-gray-300 rounded"
                            >
                                <option value="New" {% if lead.status == 'New' %}selected{% endif %}>New</option>
                                <option value="In Progress" {% if lead.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                                <option value="Closed" {% if lead.status == 'Closed' %}selected{% endif %}>Closed</option>
                            </select>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <button
                                hx-delete="{% url 'delete_lead' lead.id %}"
                                hx-target="#leads-table"
                                hx-swap="outerHTML"
                                class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded"
                            >
                                Delete
                            </button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
